[project]
name = "less-code"
version = "0.1.0"
description = "Verify-gated static and optional LLM code reduction"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-rust>=0.24.2",
]

[project.scripts]
lc = "less_code.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["less_code"]

[tool.ruff]
# Makes lc's project-style gate active for THIS repo (it only runs when a
# ruff config exists). Ruff infers target-version from requires-python too;
# pinning it here keeps a shrink from emitting 3.12-only syntax.
target-version = "py311"

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.shrinkray]
# shrinkray Phase 0.4: reduce the shipped tool only. `fixtures/` are the C2-C4
# acceptance inputs, `bench/` the corpus harness and `training/` the ML track
# (incl. the vendored getrandom crate) - measurement apparatus, not shrink
# targets.
languages = ["python"]
exclude = ["bench", "fixtures", "training"]
test_command = ".venv/bin/python -m pytest -x -q --no-header -n auto"
timeout = 900
