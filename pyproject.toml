[project]
name = "less-code"
version = "0.1.0"
description = "Verify-gated static and optional LLM code reduction"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-rust>=0.24.2",
]

[project.scripts]
lc = "less_code.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["less_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
