[project]
name = "less-code"
version = "0.1.0"
description = "Hybrid static + LLM + RL LOC reduction with verify-gated safety"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lc = "less_code.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["less_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
