# Expansion frozen before measuring yield: a strict-style Python library, a
# Python CLI/codemod, CommonJS concurrency, tiny terminal formatting, and Rust
# duration/quoting parsers. Small hand-tuned libraries remain negative controls.
[[project]]
name = "humanize"
repo = "https://github.com/python-humanize/humanize.git"
commit = "3201e702ed7eae506f793fad0aec204f387aeb4c"
lang = "python"
cohort = "expansion"
prepare = ["uv", "venv", ".venv"]
test = ["uv", "run", "--no-project", "--with", "pytest>=9", "--with", "freezegun", "--with", "pytest-cov", "--with", "pytest-benchmark", "--with-editable", ".", "python", "-m", "pytest", "-xq"]

